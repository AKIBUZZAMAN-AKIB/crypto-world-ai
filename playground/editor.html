<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Vela — Pine editor</title>
        <style>
            :root {
                --bg: #131722;
                --panel: #1a1c23;
                --panel-2: #1e2027;
                --border: #2a2b30;
                --fg: #d1d4dc;
                --fg-dim: #868a96;
                --accent: #2962ff;
                --ok: #089981;
                --err: #f23645;
                --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                background: var(--bg);
                color: var(--fg);
                font: 13px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif;
                overflow: hidden;
            }
            #app {
                display: flex;
                height: 100%;
                min-height: 0;
            }

            /* ── editor column ─────────────────────────────────────────────── */
            #side {
                display: flex;
                flex-direction: column;
                width: 48%;
                min-width: 320px;
                max-width: 70%;
                border-right: 1px solid var(--border);
                background: var(--panel);
            }
            #bar {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 10px;
                border-bottom: 1px solid var(--border);
                flex: none;
                /* On a phone the four stops do not fit one row: the title gives way first
                   (it is the only one with a fixed meaning), then Examples shrinks. Run and
                   Clear must stay reachable — they are the point of the page. */
                flex-wrap: nowrap;
                min-width: 0;
            }
            #bar .title,
            #bar select,
            #bar button {
                flex: none;
            }
            #bar select {
                min-width: 0;
                max-width: 180px;
                text-overflow: ellipsis;
            }
            #back {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 26px;
                height: 26px;
                border-radius: 6px;
                color: var(--fg-dim);
                text-decoration: none;
                font-size: 15px;
                flex: none;
                transition: background 120ms ease, color 120ms ease;
            }
            #back:hover {
                background: var(--panel-2);
                color: #f0f3fa;
            }
            #bar .title {
                font-weight: 600;
                color: #f0f3fa;
                letter-spacing: 0.2px;
            }
            #bar .spacer {
                flex: 1;
            }
            select,
            button {
                font: inherit;
                color: var(--fg);
                background: var(--panel-2);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 5px 10px;
                cursor: pointer;
                transition: border-color 120ms ease, background 120ms ease;
            }
            select:hover,
            button:hover {
                border-color: #3a3d45;
            }
            select:focus-visible,
            button:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 1px;
            }
            button.primary {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
                font-weight: 600;
            }
            button.primary:hover {
                background: #1f56f0;
            }
            button.ghost {
                background: transparent;
            }

            #editor {
                position: relative;
                flex: 1;
                min-height: 0;
                display: flex;
                overflow: hidden;
            }
            #gutter {
                flex: none;
                width: 46px;
                padding: 12px 8px 12px 0;
                text-align: right;
                color: #4b4f5a;
                font: 13px/1.55 var(--mono);
                background: var(--panel);
                user-select: none;
                overflow: hidden;
            }
            #code {
                flex: 1;
                min-width: 0;
                resize: none;
                border: 0;
                outline: 0;
                padding: 12px 14px 12px 4px;
                background: transparent;
                color: #e3e6ec;
                font: 13px/1.55 var(--mono);
                tab-size: 4;
                white-space: pre;
                overflow: auto;
                caret-color: var(--accent);
            }
            #code::selection {
                background: #29407a;
            }

            #status {
                flex: none;
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 7px 12px;
                border-top: 1px solid var(--border);
                color: var(--fg-dim);
                font-size: 12px;
                min-height: 20px;
                white-space: pre-wrap;
                font-family: var(--mono);
            }
            #status.ok {
                color: var(--ok);
            }
            #status.err {
                color: var(--err);
            }
            #status .hint {
                margin-left: auto;
                color: #5b606b;
                font-family: inherit;
            }

            /* ── chart column ──────────────────────────────────────────────── */
            #chart {
                flex: 1;
                min-width: 0;
                position: relative;
            }
            #grip {
                flex: none;
                width: 5px;
                cursor: col-resize;
                background: transparent;
                transition: background 120ms ease;
            }
            #grip:hover,
            #grip.drag {
                background: #2f3542;
            }

            @media (max-width: 860px) {
                #app {
                    flex-direction: column;
                }
                /* The title is the one stop that can go: the page has a <title>, the tab
                   and the back arrow already say where you are. Without this the Run
                   button is pushed off-screen at 390px. */
                #bar .title {
                    display: none;
                }
                #bar select {
                    flex: 1 1 auto;
                    max-width: none;
                }
                #bar .spacer {
                    display: none;
                }
                #side {
                    width: 100%;
                    max-width: none;
                    height: 52%;
                    border-right: 0;
                    border-bottom: 1px solid var(--border);
                }
                #grip {
                    display: none;
                }
                #chart {
                    height: 48%;
                }
            }
        </style>
    </head>
    <body>
        <div id="app">
            <section id="side">
                <div id="bar">
                    <a id="back" href="./workspace.html" title="Back to the workspace">&larr;</a>
                    <span class="title">Pine editor</span>
                    <select id="examples" title="Load an example"></select>
                    <span class="spacer"></span>
                    <button id="clear" class="ghost" title="Empty the editor">Clear</button>
                    <button id="run" class="primary" title="Run (Ctrl+Enter)">Run</button>
                </div>
                <div id="editor">
                    <div id="gutter" aria-hidden="true">1</div>
                    <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"
                        aria-label="Pine Script source"></textarea>
                </div>
                <div id="status"><span id="message">Write Pine Script (v5/v6) and press Run.</span><span class="hint">Ctrl+Enter</span></div>
            </section>
            <div id="grip" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
            <div id="chart"></div>
        </div>
        <script type="module" src="./editor.ts"></script>
    </body>
</html>
