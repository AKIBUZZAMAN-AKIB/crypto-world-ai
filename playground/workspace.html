<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Vela — workspace playground</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                /* The workspace publishes its own background so the page behind it (and
                   the overscroll area) follows the active theme instead of staying dark. */
                background: var(--vela-page-bg, #151619);
            }
            #workspace {
                position: absolute;
                inset: 0;
            }
        </style>
    </head>
    <body>
        <div id="workspace"></div>
        <script type="module" src="./workspace.ts"></script>
    </body>
</html>
